name: Build macOS App

on:
  workflow_dispatch:  # 手动触发
  workflow_call:       # 允许被其他 workflow 引用（release.yml）

jobs:
  build:
    name: Build HushTranslate.app
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build and verify app
        env:
          HUSHTRANSLATE_BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/make-app.sh release

      - name: Archive app
        run: ditto -c -k --sequesterRsrc --keepParent build/HushTranslate.app build/HushTranslate.app.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HushTranslate
          path: build/HushTranslate.app.zip
          if-no-files-found: error
          retention-days: 14
